version: '3.8'

services:
  neo4j:
    image: neo4j:5.18
    container_name: ecommerce-neo4j
    ports:
      - "7474:7474"   # HTTP Web UI
      - "7687:7687"   # Bolt 协议
    environment:
      NEO4J_AUTH: neo4j/all-in-rag
      NEO4J_dbms_connector_bolt_advertised__address: localhost:7687
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p all-in-rag 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
